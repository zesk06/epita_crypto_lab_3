# Six TLS servers. Each one has at least one fault. Ports on 127.0.0.1 only.
# After editing a config:  docker compose restart <service>
x-nginx: &nginx
  image: nginx:1.29-alpine
  restart: unless-stopped

services:
  legacy:
    <<: *nginx
    ports: ["127.0.0.1:8441:443"]
    volumes: ["./conf/legacy.conf:/etc/nginx/conf.d/default.conf:ro", "./certs:/etc/nginx/certs:ro"]
  chain:
    <<: *nginx
    ports: ["127.0.0.1:8442:443"]
    volumes: ["./conf/chain.conf:/etc/nginx/conf.d/default.conf:ro", "./certs:/etc/nginx/certs:ro"]
  names:
    <<: *nginx
    ports: ["127.0.0.1:8443:443"]
    volumes: ["./conf/names.conf:/etc/nginx/conf.d/default.conf:ro", "./certs:/etc/nginx/certs:ro"]
  weak:
    <<: *nginx
    ports: ["127.0.0.1:8444:443"]
    volumes: ["./conf/weak.conf:/etc/nginx/conf.d/default.conf:ro", "./certs:/etc/nginx/certs:ro"]
  order:
    <<: *nginx
    ports: ["127.0.0.1:8445:443"]
    volumes: ["./conf/order.conf:/etc/nginx/conf.d/default.conf:ro", "./certs:/etc/nginx/certs:ro"]
  vhosts:
    <<: *nginx
    ports: ["127.0.0.1:8446:443"]
    volumes: ["./conf/vhosts.conf:/etc/nginx/conf.d/default.conf:ro", "./certs:/etc/nginx/certs:ro"]
