# Six TLS servers. Each one has at least one fault. Ports on 127.0.0.1 only.
# After editing a config:  docker compose restart <service>
x-nginx: &nginx
  image: nginx:1.29-alpine
  restart: unless-stopped

services:
  legacy:
    <<: *nginx
    ports: ["127.0.0.1:8441:443"]
    volumes: ["./conf/legacy:/etc/nginx/conf.d:ro", "./certs:/etc/nginx/certs:ro"]
  chain:
    <<: *nginx
    ports: ["127.0.0.1:8442:443"]
    volumes: ["./conf/chain:/etc/nginx/conf.d:ro", "./certs:/etc/nginx/certs:ro"]
  names:
    <<: *nginx
    ports: ["127.0.0.1:8443:443"]
    volumes: ["./conf/names:/etc/nginx/conf.d:ro", "./certs:/etc/nginx/certs:ro"]
  weak:
    <<: *nginx
    ports: ["127.0.0.1:8444:443"]
    volumes: ["./conf/weak:/etc/nginx/conf.d:ro", "./certs:/etc/nginx/certs:ro"]
  order:
    <<: *nginx
    ports: ["127.0.0.1:8445:443"]
    volumes: ["./conf/order:/etc/nginx/conf.d:ro", "./certs:/etc/nginx/certs:ro"]
  vhosts:
    <<: *nginx
    ports: ["127.0.0.1:8446:443"]
    volumes: ["./conf/vhosts:/etc/nginx/conf.d:ro", "./certs:/etc/nginx/certs:ro"]
