server {
    listen 443 ssl;
    server_name app.lab.test;

    ssl_certificate     /etc/nginx/certs/app/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/app/key.pem;

    location / { return 200 "app: ok\n"; }
}

server {
    listen 443 ssl;
    server_name www.lab.test;

    ssl_certificate     /etc/nginx/certs/www/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/www/key.pem;

    location / { return 200 "www: ok\n"; }
}
