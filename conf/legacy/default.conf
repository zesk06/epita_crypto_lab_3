server {
    listen 443 ssl;
    server_name legacy.lab.test;

    ssl_certificate     /etc/nginx/certs/legacy/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/legacy/key.pem;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'AES128-SHA:AES256-SHA:AES128-SHA256:@SECLEVEL=0';
    ssl_prefer_server_ciphers on;

    location / { return 200 "legacy: ok\n"; }
}
